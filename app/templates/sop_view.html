{% extends "base.html" %}
{% block content %}
<div class="card" style="padding:0;overflow:hidden;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #e5e5e5;">
    <a href="{{ url_for('index') }}" class="btn" style="margin:0;background:#888;">&times; Close</a>
    <strong>Full PG&E Reimbursement SOP (if AI unavailable)</strong>
    <a href="{{ url_for('sop_pdf_download') }}" class="btn" style="margin:0;">Download</a>
  </div>
  <div id="sop-pdf-container" style="width:100%;max-height:80vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#525659;padding:12px 0;text-align:center;">
    <p class="muted" style="color:#fff;">Loading SOP&hellip;</p>
  </div>
</div>

<script type="module">
  const container = document.getElementById('sop-pdf-container');
  const pdfUrl = "{{ url_for('sop_pdf') }}";
  const pdfjsBase = "{{ url_for('static', filename='pdfjs/') }}";

  function showFallback(message) {
    container.innerHTML = '<p class="muted" style="color:#fff;">' + message +
      ' Use the Download button above instead.</p>';
  }

  // If nothing has rendered after 15s (slow connection, blocked script,
  // unexpected error not otherwise caught), fall back rather than leaving
  // the page stuck on "Loading SOP...".
  let rendered = false;
  setTimeout(function () {
    if (!rendered) showFallback('This is taking longer than expected.');
  }, 15000);

  (async function () {
    let pdfjsLib;
    try {
      pdfjsLib = await import(pdfjsBase + "pdf.min.mjs");
    } catch (err) {
      showFallback('Could not load the PDF viewer.');
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = pdfjsBase + "pdf.worker.min.mjs";

    try {
      const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
      container.innerHTML = '';
      for (let num = 1; num <= pdf.numPages; num++) {
        const page = await pdf.getPage(num);
        const unscaled = page.getViewport({ scale: 1 });
        const scale = Math.min(2, Math.max(0.5, (container.clientWidth - 24) / unscaled.width));
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.style.display = 'block';
        canvas.style.margin = '0 auto 12px auto';
        canvas.style.background = '#fff';
        canvas.style.boxShadow = '0 1px 4px rgba(0,0,0,0.3)';
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        container.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      }
      rendered = true;
    } catch (err) {
      showFallback('Could not load the SOP inline (' + (err && err.message ? err.message : 'unknown error') + ').');
    }
  })();
</script>
{% endblock %}
